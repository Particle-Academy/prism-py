name: Tests

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # The probe and runner tests are part of the suite, not a separate
      # category, so the corpus has to be here for `pytest` to mean anything.
      #
      # The alternative — letting those tests skip themselves when the loader is
      # absent — is the failure this whole project is about: a mechanism that is
      # correct and silently not running, reporting green.
      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-parity
          path: .parity

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The package has ZERO runtime dependencies on purpose, so the only thing
      # installed here beyond the package itself is the test tooling.
      # The six satellite ports and the harness, as SIBLINGS, because that is
      # how agent_contract's two probes reach them -- each is imported from its
      # src/ tree, from outside its repo, which is the only thing in this suite
      # asserting the packages work TOGETHER rather than each working alone.
      #
      # Those two tests failed on every run from 2026-09-01 (G-47) for the plain
      # reason that a single-repo checkout has no siblings. Letting them skip
      # when the siblings are absent was the tempting fix, and it is the failure
      # this project is about -- the comment on the corpus checkout above makes
      # the same argument. So CI supplies the siblings instead.
      #
      # No build step, unlike the TypeScript port: these are imported from src/.
      - name: Checkout the sibling ports
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-harness-py
          path: .ports/prism-harness-py
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-perplexity-py
          path: .ports/prism-perplexity-py
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-opentelemetry-py
          path: .ports/prism-opentelemetry-py
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-memory-py
          path: .ports/prism-memory-py
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-mcp-py
          path: .ports/prism-mcp-py
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser-py
          path: .ports/prism-browser-py
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus-py
          path: .ports/prism-human-plus-py

      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      - name: Install the conformance corpus
        run: python -m pip install --quiet ./.parity/loaders/py

      # -ra so skips and their reasons are always printed. A skip nobody sees
      # becomes permanent silently.
      - name: Tests
        run: python -m pytest -ra
        env:
          # Absolute, because the probes resolve this against the filesystem
          # rather than against the process's working directory.
          PRISM_PORTS_ROOT: ${{ github.workspace }}/.ports

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. The release guard requires this workflow to have succeeded for
      # the tagged commit, so a failure here also stops a publish.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  release-notes:
    name: Release-notes check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # tools/check-release-notes.sh refuses a tag annotation that does not say
      # whether the release breaks anything. It runs in publish.yml's guard, and
      # a release manager runs it by hand before tagging.
      #
      # It is tested HERE because a guard nobody tried to defeat is the recurring
      # way one of these ends up checking nothing. The suite asserts both
      # directions, and its sharpest case is a note that discusses breakage in
      # prose while declaring nothing: a plain `grep -i breaking` passes that, and
      # three real annotations in this estate are exactly that shape.
      - name: tools/check-release-notes.sh must refuse what it claims to
        run: sh tools/check-release-notes.test.sh

      # The checker is vendored rather than fetched, because for a Composer
      # package the pre-tag run is the only control that can prevent publication
      # and it has to work from the tree being tagged, offline, without piping a
      # remote script into a shell. That buys a copy, and an unchecked copy is one
      # that has already drifted without telling anyone -- prism-parity found 38
      # of 111 hand-maintained copies stale. So it is diffed, not trusted.
      - name: Fetch the canonical checker
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .canonical
          persist-credentials: false

      - name: The vendored checker must match the canonical one
        run: |
          for pair in check.sh:check-release-notes.sh check.test.sh:check-release-notes.test.sh; do
            diff -u ".canonical/release-notes/${pair%%:*}" "tools/${pair##*:}" || {
              echo "::error::tools/${pair##*:} has drifted from Particle-Academy/.github release-notes/${pair%%:*}. Change the canonical file and re-vendor it; do not patch the copy."
              exit 1
            }
          done
          echo "Both vendored files match the canonical checker."
          rm -rf .canonical
