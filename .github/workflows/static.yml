name: Static analysis

# The Python equivalents of the reference's Pint and PHPStan jobs, plus the
# packaging check that stands in for composer-require-checker.

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  # EVERY job below installs dependencies, and an install executes code:
  # `npm ci` runs lifecycle scripts, pip runs a build backend. So this gate is a
  # dependency of each of them rather than a job running alongside — a check
  # that finishes after the install has already run is a report, not a gate.
  #
  # The list is fetched, never vendored, so there is no copy here to drift.
  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job only reads files, so it keeps no token in .git/config for the
      # fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up the verifier runtime
        id: pin-checks-node
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_NODE_CACHE: ${{ runner.tool_cache }}
          PIN_NODE_VERSION: ${{ steps.pin-checks-node.outputs.node-version }}
          PIN_NODE_ARCH: ${{ runner.arch }}
          PIN_RUNNER_OS: ${{ runner.os }}
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          version="${PIN_NODE_VERSION#v}"
          arch="${PIN_NODE_ARCH,,}"
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "Invalid setup-node version"; exit 1; }
          [[ "$arch" =~ ^(x64|arm64|x86|armv7l)$ ]] || { echo "Invalid setup-node architecture"; exit 1; }
          cache="${PIN_NODE_CACHE//\\//}"
          [[ "$cache" == /* || "$cache" =~ ^[A-Za-z]:/ ]] || { echo "Tool cache is not absolute"; exit 1; }
          case "$PIN_RUNNER_OS" in
            Windows) node_bin="$cache/node/$version/$arch/node.exe" ;;
            Linux|macOS) node_bin="$cache/node/$version/$arch/bin/node" ;;
            *) echo "Unsupported verifier platform"; exit 1 ;;
          esac
          [[ -x "$node_bin" ]] || { echo "setup-node executable missing"; exit 1; }
          "$node_bin" -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The Types job checks conformance/ as well as src/, and the runner
      # imports the loader — so the corpus has to be here. Exempting the runner
      # from type checking instead would exempt exactly the code most likely to
      # rot when the corpus moves.
      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-parity
          path: .parity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m pip install --quiet ./.parity/loaders/py

      # Strict, and over the conformance runner too — the runner is the thing
      # that has to keep working when the corpus moves, so leaving it unchecked
      # would exempt exactly the code most likely to rot.
      - run: python -m mypy --strict src conformance

  package:
    name: Package contents
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build

      - name: Build the distributions
        run: python -m build

      # The reference runs composer-require-checker so a declared dependency
      # list cannot drift from the symbols actually used. Here the equivalent
      # failures are a wheel that forgot py.typed — which silently makes every
      # downstream consumer carry an ignore_missing_imports override — or a
      # runtime dependency creeping into a package that declares none.
      - name: The wheel carries py.typed, and no runtime dependencies crept in
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile, tomllib

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          problems = []

          if not any(n.endswith("prism/py.typed") for n in names):
              problems.append(
                  "py.typed is missing from the wheel. Without it mypy treats this "
                  "package as untyped and every consumer has to carry an override."
              )

          if not any(n.startswith("prism/") and n.endswith(".py") for n in names):
              problems.append("the wheel contains no package modules")

          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          if declared:
              problems.append(f"unexpected runtime dependencies: {declared}")

          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)

          print(f"Wheel contents look right ({len(names)} entries, zero runtime dependencies).", file=sys.stderr)
          PY
