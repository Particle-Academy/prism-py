name: Static analysis

# The Python equivalents of the reference's Pint and PHPStan jobs, plus the
# packaging check that stands in for composer-require-checker.

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The Types job checks conformance/ as well as src/, and the runner
      # imports the loader — so the corpus has to be here. Exempting the runner
      # from type checking instead would exempt exactly the code most likely to
      # rot when the corpus moves.
      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-parity
          path: .parity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m pip install --quiet ./.parity/loaders/py

      # Strict, and over the conformance runner too — the runner is the thing
      # that has to keep working when the corpus moves, so leaving it unchecked
      # would exempt exactly the code most likely to rot.
      - run: python -m mypy --strict src conformance

  package:
    name: Package contents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build

      - name: Build the distributions
        run: python -m build

      # The reference runs composer-require-checker so a declared dependency
      # list cannot drift from the symbols actually used. Here the equivalent
      # failures are a wheel that forgot py.typed — which silently makes every
      # downstream consumer carry an ignore_missing_imports override — or a
      # runtime dependency creeping into a package that declares none.
      - name: The wheel carries py.typed, and no runtime dependencies crept in
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile, tomllib

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          problems = []

          if not any(n.endswith("prism/py.typed") for n in names):
              problems.append(
                  "py.typed is missing from the wheel. Without it mypy treats this "
                  "package as untyped and every consumer has to carry an override."
              )

          if not any(n.startswith("prism/") and n.endswith(".py") for n in names):
              problems.append("the wheel contains no package modules")

          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          if declared:
              problems.append(f"unexpected runtime dependencies: {declared}")

          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)

          print(f"Wheel contents look right ({len(names)} entries, zero runtime dependencies).", file=sys.stderr)
          PY
