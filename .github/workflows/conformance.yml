name: Conformance

# Runs the prism-parity corpus against this port, plus the discrimination probes.
#
# The probes are the half that makes the corpus a measurement rather than
# decoration: a faithful control that must pass everything, and eleven mutants
# that must each fail an EXACT set of case ids. A table every plausible
# implementation passes proves nothing.

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:
  # The corpus moves on its own schedule. A port that was conformant on Monday
  # can be behind on Tuesday without anything in this repository changing.
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: read

jobs:
  conformance:
    name: Corpus and probes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-parity
          path: .parity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      # THE LOADER GOES LAST. pip is less prone to pruning than npm, but the
      # ordering rule is kept identical across the ports on purpose: a rule that
      # holds in one language and not another is a rule nobody remembers.
      #
      # The runner exits 3 when the loader cannot be imported, rather than
      # falling back to anything, so a mistake here fails loudly instead of
      # reporting an empty run as a success.
      - name: Install the conformance corpus
        run: python -m pip install --quiet ./.parity/loaders/py

      - name: Corpus
        run: python conformance/runner.py

      - name: Probes
        run: python -m pytest tests/test_probes.py -ra
